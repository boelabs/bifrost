# Bifrost from published images. Nothing is built, so this file is complete on its own: paste it
# into Coolify, Dokploy or Portainer, or run it anywhere Docker is installed.
#
#   curl -O https://raw.githubusercontent.com/boelabs/bifrost/main/docker/compose.images.yaml
#   cp .env.example .env   # then fill it in
#   docker compose -f compose.images.yaml up -d
#
# Use docker-compose.yml instead when you want to build from a checkout of this repository. The
# documentation site is not here: it shares nothing with the gateway, so it lives in
# compose.docs.yaml.
#
# There is no migration service: the gateway applies pending migrations at boot, behind an advisory
# lock, so every replica can do it and only one does.
#
# The gateway and the dashboard are two products, each with its own environment. The only
# thing joining them is GATEWAY_URL on the dashboard: everything the browser needs, the
# dashboard fetches itself, so the gateway never has to be exposed.
name: bifrost

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bifrost}
    volumes:
      # PG18 moved PGDATA to /var/lib/postgresql/18/docker; the volume is mounted on the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-bifrost}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/boelabs/bifrost-gateway:latest}
    env_file:
      # Optional so `docker compose config` works in a fresh checkout; in a real deployment this is
      # where MASTER_KEY, ENCRYPTION_KEYRING and the DASH_* settings come from.
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://gateway:${POSTGRES_PASSWORD}@postgres:5432/bifrost}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Shutdown budget. The gateway stays unready-but-serving for DRAIN_DELAY_MS so the proxy can
      # take it out of rotation, then gives in-flight requests SHUTDOWN_TIMEOUT_MS to finish.
      DRAIN_DELAY_MS: ${DRAIN_DELAY_MS:-15000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-120000}
    expose:
      - "4000"
    # Must exceed DRAIN_DELAY_MS + SHUTDOWN_TIMEOUT_MS plus teardown, or Docker SIGKILLs the process
    # mid-drain and the whole sequence is theatre. Raise all three together.
    stop_grace_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Remove this service entirely if you do not want a dashboard — then set DASH_ENABLED=false so the
  # gateway stops mounting /auth as well.
  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/boelabs/bifrost-dashboard:latest}
    environment:
      # The only address it needs. The browser never talks to the gateway directly, so the
      # gateway needs no public domain of its own.
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:4000}
    expose:
      - "3001"
    depends_on:
      gateway:
        condition: service_started
    # The playground relays a live stream through this process; Next stops accepting connections on
    # SIGTERM and waits for in-flight requests, so the grace period is what that wait is allowed to
    # use.
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
