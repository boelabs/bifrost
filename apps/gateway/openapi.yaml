        routingStrategy:
          type: string
          enum:
            - simple-shuffle
            - least-busy
            - usage-based-tpm
            - usage-based-rpm
            - latency-based
            - throughput-based
            - price-based
            - health-aware
        unsupportedParameterStrategy:
          description: How the router handles parameters explicitly marked unsupported by the selected deployment profile.
          type: string
          enum:
            - drop
            - error
            - allow
        allowedFails:
          description: Absolute ceiling of transient failures in the fixed window. It opens the circuit regardless of how much traffic succeeded, so it exists for a deployment failing outright before the window has collected minWindowRequests attempts.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        allowedFailsByClass:
          description: Per-error-class override of allowedFails. A timeout and a 502 are both transient and rarely deserve the same tolerance.
          type: object
          propertyNames:
            type: string
            enum:
              - bad_request
              - auth
              - permission
              - not_found
              - rate_limit
              - context_window
              - content_policy
              - timeout
              - server
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        failureRatePercent:
          description: Share of a window's attempts that must fail before the circuit opens (0.5 = half). This is the primary signal; an absolute count punishes a busy deployment for the same error rate a quiet one survives.
          type: number
          exclusiveMinimum: 0
          maximum: 1
        minWindowRequests:
          description: Attempts required in the window before the rate rule may fire. Without a floor, the first failures after a quiet period read as a 100% failure rate.
          type: integer
          minimum: 1
          maximum: 9007199254740991
        protectLastDeployment:
          description: Never open the deployment circuit when a public model has nowhere else to route. Quarantining the only deployment turns a degraded upstream into a total outage, and the gateway's 503 is less useful to the caller than the upstream's own error.
          type: boolean
        adaptiveTimeoutsEnabled:
          description: Narrow each attempt's first-output deadline to a multiple of what that deployment usually takes, instead of the budget the slowest member of the pool needs.
          type: boolean
        adaptiveTimeoutMultiplier:
          description: How many times its own typical time-to-first-output a deployment is granted.
          type: number
          minimum: 1
        adaptiveTimeoutFloorMs:
          description: Lower bound for the adaptive deadline, so a very fast deployment is not cut off by ordinary variance.
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        cooldownSeconds:
          description: Time a deployment remains unavailable after exceeding allowedFails. Zero disables automatic cooldown circuits.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        failureWindowSeconds:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        maxCooldownSeconds:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        halfOpenProbeSeconds:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        configurationCooldownSeconds:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        throttleCooldownSeconds:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        retryAfterSeconds:
          description: Minimum wait before a transient retry. Exponential full jitter is added above this floor.
          type: integer
          minimum: 0
          maximum: 9007199254740991
