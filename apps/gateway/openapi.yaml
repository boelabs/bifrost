  /admin/audit:
    get:
      tags:
        - Admin
      summary: Read the operator audit trail (owner, paginated, newest first)
      description: "Merges the record of mutating /admin calls with the record of retained-payload reads. Append-only: there is no write or delete route. Interleaving reads both tables, so `offset + limit` is capped at 5000 — reach older entries with a date range or a narrower filter, not a deeper page. Entries are kept for ADMIN_AUDIT_RETENTION_DAYS."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - admin
              - payload_access
          description: Absent means both.
        - name: actor
          in: query
          schema:
            type: string
          description: Substring match.
        - name: action
          in: query
          schema:
            type: string
          description: Substring match, e.g. "DELETE" or "/admin/keys".
        - name: targetType
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                required:
                  - data
                  - pagination
                additionalProperties: false
        "400": *a1
