  /admin/observability/metrics:
    get:
      tags:
        - Admin
      summary: Detailed request and deployment metrics
      description: Requires usage:read. Range is [start, end), at most 31 days, based on request start. Request totals count each operation once; deployment tokens and errors include only that deployment's attempts, including retries. A deployment filter selects requests that used it; request cost is never attributed to individual attempts. Only retained records contribute. Buckets are anchored at start.
      parameters:
        - in: query
          name: start
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          required: true
        - in: query
          name: end
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          required: true
        - in: query
          name: bucket
          schema:
            default: hour
            type: string
            enum:
              - hour
              - day
        - in: query
          name: publicModel
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - in: query
          name: deploymentId
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - in: query
          name: operation
          schema:
            type: string
            enum:
              - text.generate
              - image.generate
              - image.edit
              - video.generate
              - audio.transcribe
              - embedding.create
              - rerank
      responses:
        "200":
          description: Request and upstream-attempt aggregates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DetailedMetrics"
                required:
                  - data
                additionalProperties: false
        "400": *a1
        "401": *a1
        "403": *a1
  /admin/usage:
    get:
      tags:
        - Admin
      summary: Aggregate usage (requests, tokens, search units, cost), optionally grouped (master key)
      description: Sums consumer usage/cost and estimated upstream cost over gateway operations. Accepts the same filters as /admin/logs. groupBy=none returns a single total.
      parameters:
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum:
              - public_model
              - virtual_key
              - actor
              - hour
              - day
              - none
            default: none
        - name: virtualKeyId
          in: query
          schema:
            type: string
            format: uuid
        - name: publicModel
          in: query
          schema:
            type: string
        - name: adapterKey
          in: query
          schema:
            type: string
        - name: callType
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
        - name: cacheHit
          in: query
          schema:
            type: boolean
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Aggregated usage and cost, one row per group
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UsageRow"
                required:
                  - data
                additionalProperties: false
        "400": *a1
  /admin/router-settings:
    get:
      tags:
        - Admin
      summary: View router config (master key)
      responses:
        "200":
          description: Effective router configuration, or null when never written
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - $ref: "#/components/schemas/RouterSettingsState"
                      - type: "null"
                required:
                  - data
                additionalProperties: false
    put:
      tags:
        - Admin
      summary: Update router config (master key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterSettings"
      responses:
        "200":
          description: Updated router configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RouterSettingsState"
                required:
                  - data
                additionalProperties: false
  /admin/dashboard-settings:
    get:
      tags:
        - Admin
      summary: View operator-session policy (owner)
      responses:
        "200":
          description: Session lifetime, idle window and login lockout
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardSettingsState"
                required:
                  - data
                additionalProperties: false
    put:
      tags:
        - Admin
      summary: Update operator-session policy (owner)
      description: "Requires the users:manage permission: session lifetime and lockout decide how long a stolen cookie is worth stealing. Takes effect within seconds across replicas."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardSettings"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardSettingsState"
                required:
                  - data
                additionalProperties: false
        "400": *a1
  /admin/fallbacks:
    get:
      tags:
        - Admin
      summary: List fallbacks (master key)
      responses:
        "200":
          description: Fallback chains
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FallbackPolicy"
                required:
                  - data
                additionalProperties: false
    put:
      tags:
        - Admin
      summary: Create/update dedicated fallback (master key)
      description: Configures an exact chain by (primaryModel, reason). Public Models must exist and each target must share at least one executable operation with the primary. The router exhausts the primary deployments before traversing the chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fallback"
            examples:
              general:
                value:
                  primaryModel: gpt
                  fallbackModels:
                    - gemini
                  reason: general
      responses:
        "201":
          description: Fallback chain upserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FallbackPolicy"
                required:
                  - data
                additionalProperties: false
        "400": *a1
  /admin/fallbacks/{primaryModel}/{reason}:
    delete:
      tags:
        - Admin
      summary: Delete fallback (master key)
      parameters:
        - name: primaryModel
          in: path
          required: true
          schema:
            type: string
        - name: reason
          in: path
          required: true
          schema:
            type: string
            enum:
              - general
              - context_window
              - content_policy
      responses:
        "204":
          description: No Content
