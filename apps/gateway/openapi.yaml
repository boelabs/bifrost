            type: string
        - name: failurePhase
          in: query
          schema:
            type: string
        - name: minDurationMs
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxDurationMs
          in: query
          schema:
            type: number
            minimum: 0
        - name: requestId
          in: query
          schema:
            type: string
        - name: cacheHit
